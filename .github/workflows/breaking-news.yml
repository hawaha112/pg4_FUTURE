name: AI 突发热点检测
# P1: 24 小时突发推送
# 每小时扫一次外部热度源 (HN/HF/GitHub), 命中阈值即推 TG.
# 不依赖 events.db / 不跑 collector — 只消费 hot_signals, 跑得快 (< 30s).
#
# 触发:
#   - workflow_dispatch (手动 / Anthropic Routine 调)
#   - schedule cron (兜底, 万一 routine 失效仍然有保护)
#
# 状态文件 output/pushed_breaking.json 通过 GH Actions Cache 持久化,
# 实现 24h 去重 (同事件不重复推).

on:
  workflow_dispatch:
    inputs:
      min_points:
        description: 'HN 分数阈值覆盖 (测试/演示用临时降阈; 留空=默认 300)'
        type: string
        default: ''
      demo_title:
        description: '翻译卡片演示: 填一条标题即推一张[演示]卡片(走真实翻译, 不进去重)'
        type: string
        default: ''
  # 兜底 cron — 主触发由 Anthropic Routine 提供 (更准时)
  # 这条 cron 只在 routine 长期失效时拯救; 平时大概率被 routine 抢先执行
  schedule:
    - cron: '15 * * * *'   # 每小时第 15 分钟 (避开整点拥堵)

concurrency:
  group: breaking-news
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # GH Actions Cache 需要

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BRIEFING_URL: ${{ secrets.BRIEFING_URL }}
      # 手动 dispatch 时可临时降阈值(测试/演示); 留空走默认 300
      BREAKING_HN_POINTS: ${{ github.event.inputs.min_points || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 加载去重历史 (Actions Cache, 24h 滚动) ──
      - name: Restore dedup state
        id: cache-dedup
        uses: actions/cache@v4
        with:
          path: |
            ai-morning-news/output/pushed_breaking.json
            ai-morning-news/output/breaking_tg_state.json
          # key 含日期, 自动滚动; restore-keys 让今天可以读昨天的
          key: pushed-breaking-${{ github.run_id }}
          restore-keys: |
            pushed-breaking-

      - name: Install minimal deps
        run: |
          # detector 只用标准库 + 可选 certifi (项目其他地方也用)
          python3 -m pip install --quiet certifi

      # 两段式: detect 纯 stdlib(每小时, 快), 无命中即止; 仅当有命中才装 claude 翻译推送。
      - name: Detect breaking (纯 stdlib, 无命中即止)
        id: detect
        run: |
          mkdir -p ai-morning-news/output
          cd ai-morning-news
          python3 breaking_news_detector.py detect
          N=$(python3 -c "import json,os;p='output/breaking_pending.json';print(len(json.load(open(p))) if os.path.exists(p) else 0)" 2>/dev/null || echo 0)
          echo "hits=$N" >> "$GITHUB_OUTPUT"
          echo "🎯 本次新突发命中: $N 条"

      - name: 翻译+累积+渲染突发页 (仅当有命中 — 此时才装 claude + 调 LLM)
        if: steps.detect.outputs.hits != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # push: 翻译新突发→累积进库→写 breaking.json + push flag。不再逐条推 TG。
          # 装 claude 失败也不致命: 翻译回退英文原标题。
          npm install -g @anthropic-ai/claude-code || echo "⚠️ claude 安装失败, 将回退英文原标题"
          cd ai-morning-news
          nohup python3 -u claude_proxy.py > /tmp/breaking_proxy.log 2>&1 &
          PROXY_PID=$!
          for i in $(seq 1 30); do
            curl -s http://localhost:3456/health >/dev/null 2>&1 && { echo "proxy ready (${i}s)"; break; }
            sleep 1
          done
          python3 breaking_news_detector.py push
          kill "$PROXY_PID" 2>/dev/null || true

      - name: 部署突发页 + 删旧推新 TG 链接 (仅当有新增突发)
        if: steps.detect.outputs.hits != '0'
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          DEPLOY_REPO: hawaha112/ai-morning-briefing
        run: |
          cd ai-morning-news
          [ -f output/breaking_push.flag ] || { echo "无 push flag, 跳过"; exit 0; }
          # `|| true`: flag 无结尾换行时 read 撞 EOF 返回非零, bash -e 会误杀整步骤
          read NEW TOTAL < output/breaking_push.flag || true
          if ! [ "${NEW:-0}" -gt 0 ] 2>/dev/null; then echo "本次无新增突发, 不部署/不推送"; exit 0; fi
          # 1) 部署 breaking.json → 部署仓 archive/breaking.json (走 archive/** 白名单; 早报页前端拉它渲染顶部突发区)
          TMP=$(mktemp -d)
          if git clone --depth 1 "https://x-access-token:${DEPLOY_REPO_TOKEN}@github.com/${DEPLOY_REPO}.git" "$TMP" 2>&1 | tail -1; then
            mkdir -p "$TMP/archive"; cp output/breaking.json "$TMP/archive/breaking.json"
            git -C "$TMP" add archive/breaking.json
            if git -C "$TMP" -c user.email=action@github.com -c user.name=action commit -q -m "breaking: $(date -u +%FT%TZ) (+${NEW})"; then
              git -C "$TMP" push 2>&1 | tail -1 || { echo "push 冲突, rebase 重试"; git -C "$TMP" pull --rebase 2>&1 | tail -1; git -C "$TMP" push 2>&1 | tail -1 || echo "重试仍失败(下轮再补)"; }
            else echo "breaking.json 无变化"; fi
          else echo "克隆部署仓失败"; fi
          rm -rf "$TMP"
          # 2) 删旧推新: 窗口里只保留一条突发提醒, 链接指向早报(顶部即突发区块)
          URL="${BRIEFING_URL}"
          STATE=output/breaking_tg_state.json
          PREV=$(python3 -c "import json,os;p='$STATE';print(json.load(open(p)).get('msg_id','') if os.path.exists(p) else '')" 2>/dev/null || echo "")
          [ -n "$PREV" ] && curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/deleteMessage" -d "chat_id=${TG_CHAT_ID}" -d "message_id=${PREV}" >/dev/null 2>&1 || true
          # ⚠️ 一点直达不弹"Open Link?"的唯一办法: 裸 URL 纯文本(显示==URL, 无伪装)。
          # <a href> 伪装链接 / inline 按钮(文字≠URL) 在频道里都会触发反钓鱼二次确认。
          TEXT=$'🚨 <b>AI 突发</b> · 近 24h 共 '"${TOTAL}"$' 条\n\n📖 打开早报看突发（顶部）：\n'"${URL}"
          RESP=$(curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${TEXT}" -d "parse_mode=HTML" -d "disable_web_page_preview=true") || RESP=""
          NEWID=$(printf '%s' "$RESP" | python3 -c "import sys,json;d=json.loads(sys.stdin.read() or '{}');print((d.get('result') or {}).get('message_id','') if isinstance(d,dict) else '')" 2>/dev/null || echo "")
          if [ -n "$NEWID" ]; then
            printf '{"msg_id": %s, "updated_at": "%s"}' "$NEWID" "$(date -u +%FT%TZ)" > "$STATE"
            echo "✅ 突发链接已更新: 删旧(${PREV:-无}) → 新(${NEWID}) · 共 ${TOTAL} 条"
          else
            echo "⚠️ 未取到新 msg_id(silent/失败), 保留旧 id"
          fi

      - name: 翻译卡片演示 (仅当填了 demo_title)
        if: github.event.inputs.demo_title != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEMO_TITLE: ${{ github.event.inputs.demo_title }}
        run: |
          npm install -g @anthropic-ai/claude-code || echo "⚠️ claude 装失败, 演示回退英文原标题"
          cd ai-morning-news
          nohup python3 -u claude_proxy.py > /tmp/breaking_proxy.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            curl -s http://localhost:3456/health >/dev/null 2>&1 && { echo "proxy ready (${i}s)"; break; }
            sleep 1
          done
          python3 breaking_news_detector.py demo "$DEMO_TITLE"
          kill "$PID" 2>/dev/null || true

      # ── 持久化更新后的去重状态 (cache 自动 save) ──
      # actions/cache 在 post-action 阶段自动保存 path 内容
      # (这里 run_id 唯一, restore-keys 让下一次跑能拿到)

      - name: Show dedup summary
        if: always()
        run: |
          if [ -f ai-morning-news/output/pushed_breaking.json ]; then
            echo "Pushed history (last 24h):"
            python3 -c "
          import json
          d = json.load(open('ai-morning-news/output/pushed_breaking.json'))
          for k, v in list(d.items())[:10]:
              print(f'  [{v.get(\"source\", \"?\")}] score={v.get(\"score\", 0)} pushed={v.get(\"pushed_at\", \"\")[:16]} {v.get(\"title\", \"\")[:50]}')"
          fi
