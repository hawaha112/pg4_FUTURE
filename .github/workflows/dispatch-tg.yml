name: Dispatch TG Message
# 通用 TG 发送 workflow —— 任何"手动发 TG"操作都通过这个,
# 云端发,不依赖本地 ~/.config/ai-briefing/.env。
#
# 使用:
#   gh workflow run dispatch-tg.yml -R hawaha112/pg4_FUTURE \
#     -f message="<b>your html message</b>" \
#     -f preset=none

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message text (HTML or Markdown supported)'
        required: false
        type: string
        default: ''
      parse_mode:
        description: 'Parse mode'
        type: choice
        options: [HTML, Markdown, plain]
        default: HTML
      preset:
        description: 'Preset content (overrides message field if not none)'
        type: choice
        options: [none, dashboard_snapshot, health_ping]
        default: none

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BRIEFING_URL: ${{ secrets.BRIEFING_URL }}
      PRESET: ${{ inputs.preset }}
      MSG: ${{ inputs.message }}
      PARSE_MODE: ${{ inputs.parse_mode }}

    steps:
      - uses: actions/checkout@v4

      - name: Build message body
        id: build
        run: |
          python3 .github/scripts/build_tg_message.py > /tmp/tg_body.txt
          echo "preview (first 200 chars):"
          head -c 200 /tmp/tg_body.txt; echo

      - name: Send to Telegram
        env:
          BODY_FILE: /tmp/tg_body.txt
        run: |
          BODY="$(cat /tmp/tg_body.txt)" python3 -c '
          import json, os, sys, urllib.request
          parse = os.environ.get("PARSE_MODE", "HTML")
          data = {
              "chat_id": os.environ["TG_CHAT_ID"],
              "text": os.environ["BODY"],
              "disable_web_page_preview": False,
          }
          if parse and parse != "plain":
              data["parse_mode"] = parse
          payload = json.dumps(data, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_BOT_TOKEN']}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              body = json.loads(resp.read().decode())
              print(json.dumps(body, ensure_ascii=False, indent=2))
              if not body.get("ok"):
                  sys.exit(1)
          '
