name: 每日运维健康检查
# 每天跑一次, 检测可能"静默坏掉"的系统问题:
# - 死源激增 / 信源告警
# - briefing-state 分支 >= 36h 没 push (流水线可能死了)
# - GitHub PAT 剩余 < 14 天告警
#
# 只在有问题时推 TG (健康时静默), 不变成噪音.
# < 30 秒跑完, 不消耗 LLM token, 不依赖业务流水线.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 1 * * *'   # UTC 01:30 = 北京 09:30 (上班后, 你能立即响应)

concurrency:
  group: daily-ops
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 链式触发 auto-fix-sources workflow
  issues: write    # 不可自愈的问题自动开 issue

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TZ: Asia/Shanghai
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      # 给 Python 脚本: 链式触发 auto-fix workflow + briefing-state freshness 检查
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 给 gh CLI 用 (gh 自动认 GH_TOKEN)
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 兼容旧名 (PAT 自检)
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # 部署仓 PAT 临期自检 (2026-06-08: 它过期导致早晚报部署失败却无预警, 故纳入每日检查)
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4    # main 代码到默认 . (含 daily_ops_check.py)

      - uses: actions/checkout@v4
        with:
          ref: briefing-state         # 状态分支到 _state/ 子目录
          path: _state

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run daily ops check
        run: |
          # 把 state 分支的 events.db 拷到主代码预期路径
          if [ -f _state/ai-morning-news/events.db ]; then
            cp _state/ai-morning-news/events.db ai-morning-news/events.db
            echo "✓ 加载 events.db ($(du -h ai-morning-news/events.db | cut -f1))"
          else
            echo "⚠️ briefing-state 上没找到 events.db, 跳过 source_health 检查"
          fi
          cd ai-morning-news
          python3 daily_ops_check.py
