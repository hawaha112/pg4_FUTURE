name: AI Morning Briefing
# 云端运行版本：直接调 run_daily.sh（与 Mac launchd 用同一份脚本，行为完全一致）。
#
# 状态(events.db / dedup.db / llm_cache.db) 通过独立分支 briefing-state 同步：
#   · 启动时 checkout briefing-state → 覆盖 ai-morning-news/ 下的 db 文件
#   · run_daily.sh 跑完后，force-push 更新后的 db 回 briefing-state（孤立分支，永远只 1 个 commit）
#
# 触发方式：
#   - workflow_dispatch（手动）：可强制 shift（am/pm/auto）
#   - schedule cron：北京 06:00 早班 + 18:00 晚班（与本地 launchd plist 一致）
#     · 当前注释，正式切到云端时取消注释 + 关本地 launchd

on:
  workflow_dispatch:
    inputs:
      shift:
        description: 'Force shift (auto = follow current UTC time)'
        type: choice
        options: [auto, am, pm]
        default: auto
      backfill_polluted_hours:
        description: '出报前重跑此小时数内"LLM 字段全空"文章 (token 失效后用), 0=跳过'
        type: string
        default: '0'
      silent_tg:
        description: '手动 dispatch 测试用: 跳过 TG 推送, 避免噪音'
        type: boolean
        default: false
      window_hours:
        description: '验证/补漏用: 把发布时间窗覆盖为"最近 N 小时"(不分 am/pm 班次), 留空=走正常班次窗口'
        type: string
        default: ''
  # ⚠️ GH Actions schedule 已禁用 (2026-05-15). 触发改由 Anthropic Routine 走
  # workflow_dispatch — 解决 GH cron 整点队列拥堵导致 30-90 分钟延迟的问题
  # (实测准时性: routine ~5 分钟内 vs GH schedule 30-90 分钟).
  # 详情见 CLAUDE.md "调度方案" 章节. 想回退就把下面两行 cron 取消注释.
  # schedule:
  #   - cron: '0 22 * * *'   # UTC 22:00 = 北京 06:00 早班
  #   - cron: '0 10 * * *'   # UTC 10:00 = 北京 18:00 晚班

concurrency:
  group: ai-morning-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # 需要 push briefing-state 分支
    env:
      # 强制时区为北京时间 — Python datetime.now()、shell date 都会自动用此值，
      # 否则 GH runner 默认 UTC，UI 上显示的时间会比北京时间晚 8 小时。
      TZ: Asia/Shanghai
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BRIEFING_URL: ${{ secrets.BRIEFING_URL }}
      # 部署认证: SSH deploy key 优先(永不过期), DEPLOY_REPO_TOKEN 仅兜底
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
      DEPLOY_REPO: hawaha112/ai-morning-briefing
      # 口播 TTS: edge(微软云声) / kokoro(开源本地, 更自然, 失败自动回退 edge)
      BROADCAST_ENGINE: edge
      BROADCAST_VOICE: zh-CN-XiaoxiaoNeural

    steps:
      - name: Checkout main (代码)
        uses: actions/checkout@v4

      - name: Checkout briefing-state (db 快照)
        uses: actions/checkout@v4
        with:
          ref: briefing-state
          path: .briefing-state
        continue-on-error: true   # 第一次没此分支也允许冷启动

      - name: Restore db files from state branch
        shell: bash
        run: |
          if [ -d .briefing-state/ai-morning-news ]; then
            cp -f .briefing-state/ai-morning-news/*.db ai-morning-news/ 2>/dev/null || true
            cp -f .briefing-state/ai-morning-news/*.json ai-morning-news/ 2>/dev/null || true
            # output/run_health.jsonl: dashboard_generator 必读,缺它不生成 dashboard.html
            mkdir -p ai-morning-news/output
            cp -f .briefing-state/ai-morning-news/output/run_health.jsonl \
              ai-morning-news/output/run_health.jsonl 2>/dev/null || true
            echo "✓ 从 briefing-state 接续状态"
            ls -la ai-morning-news/*.db 2>/dev/null | awk '{print "  · " $9 ": " $5 " bytes"}'
            [ -f ai-morning-news/output/run_health.jsonl ] && \
              echo "  · run_health.jsonl: $(wc -l < ai-morning-news/output/run_health.jsonl) 条历史"
          else
            echo "⚠️ briefing-state 不存在，从 0 冷启动"
          fi
          # 删 worktree 备份目录（git checkout 留下的元数据，不需要）
          rm -rf .briefing-state

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          pip install certifi
          # curl_cffi: tls_client 用它模拟 Chrome TLS 指纹, 绕 Cloudflare/Substack 反爬。
          # 不装则回退裸 urllib → Substack(Import AI 等)/严审站间歇 403。装不上不致命。
          pip install curl_cffi || echo "⚠️ curl_cffi 安装失败(非致命: 回退 urllib, 严审站可能 403)"
          # edge-tts+mutagen: 口播音频(5-6 分钟 TTS+背景乐)。装不上仅无音频, 不挡早报。
          pip install edge-tts mutagen || echo "⚠️ edge-tts 安装失败(非致命: 本班无音频)"

      # ── Kokoro 开源 TTS(仅 BROADCAST_ENGINE=kokoro 时): 模型缓存 + 依赖 ──
      - name: Cache Kokoro models
        if: env.BROADCAST_ENGINE == 'kokoro'
        uses: actions/cache@v4
        with:
          path: ai-morning-news/models
          key: kokoro-v1.1-zh

      - name: Install Kokoro deps
        if: env.BROADCAST_ENGINE == 'kokoro'
        run: |
          pip install kokoro-onnx "misaki[zh]" espeakng-loader phonemizer-fork num2words soundfile \
            || echo "⚠️ kokoro 依赖安装失败(非致命: tts_broadcast 自动回退 edge)"

      - name: Install Claude Code CLI
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code
          which claude && claude --version
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN 未设置"
            exit 1
          fi

      - name: Determine shift
        id: shift
        shell: bash
        run: |
          INPUT_SHIFT="${{ github.event.inputs.shift }}"
          CRON="${{ github.event.schedule }}"
          # 优先级: 手动 input → cron 表达式 → wall clock (仅手动 dispatch 且 auto 时走 fallback)
          # 不靠 wall clock 主因: GH cron 经常延迟 5-15 分钟, 06:00 cron 实际可能 06:54
          # 触发, 让 wall clock 边界判错班次。直接读 github.event.schedule 最准。
          if [ -n "$INPUT_SHIFT" ] && [ "$INPUT_SHIFT" != "auto" ]; then
            FINAL=$INPUT_SHIFT
            REASON="manual input"
          elif [ "$CRON" = "0 22 * * *" ]; then
            FINAL=am
            REASON="cron 北京 06:00 (am)"
          elif [ "$CRON" = "0 10 * * *" ]; then
            FINAL=pm
            REASON="cron 北京 18:00 (pm)"
          else
            UTC_HOUR=$(date -u +%-H)
            CN_HOUR=$(( (UTC_HOUR + 8) % 24 ))
            if [ "$CN_HOUR" -lt 12 ]; then
              FINAL=am
            else
              FINAL=pm
            fi
            REASON="wall clock fallback (CN=$CN_HOUR)"
          fi
          echo "shift=$FINAL" >> $GITHUB_OUTPUT
          echo "→ shift=$FINAL ($REASON, UTC $(date -u +%H:%M), CN $(TZ='Asia/Shanghai' date +%H:%M))"

      - name: Backfill polluted articles (optional)
        if: github.event.inputs.backfill_polluted_hours != '' && github.event.inputs.backfill_polluted_hours != '0'
        working-directory: ai-morning-news
        shell: bash
        run: |
          # 启 proxy（run_daily.sh 自己也会启，这里独立启好让 backfill 用）
          nohup python3 -u claude_proxy.py > /tmp/backfill_proxy.log 2>&1 &
          PROXY_PID=$!
          for i in $(seq 1 30); do
            curl -s http://localhost:3456/health > /dev/null 2>&1 && break
            sleep 1
          done
          python3 backfill_polluted_analysis.py "${{ github.event.inputs.backfill_polluted_hours }}" 2>&1 | tee backfill.log
          kill "$PROXY_PID" 2>/dev/null || true

      - name: Run run_daily.sh (跟 Mac launchd 同一份脚本)
        working-directory: ai-morning-news
        env:
          BRIEFING_SHIFT_OVERRIDE: ${{ steps.shift.outputs.shift }}
          BRIEFING_SILENT_TG: ${{ github.event.inputs.silent_tg }}
          BRIEFING_WINDOW_HOURS: ${{ github.event.inputs.window_hours }}
        run: bash run_daily.sh

      - name: Push updated state back to briefing-state
        if: success()
        shell: bash
        run: |
          STATE_DIR=$(mktemp -d)
          cd "$STATE_DIR"
          git init -q -b briefing-state
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          mkdir -p ai-morning-news ai-morning-news/output
          cd "$GITHUB_WORKSPACE/ai-morning-news"
          for f in events.db dedup.db llm_cache.db source_health.json history.json tg_state.json; do
            [ -f "$f" ] && cp "$f" "$STATE_DIR/ai-morning-news/" || true
          done
          # output/run_health.jsonl: dashboard 历史趋势 + dashboard_generator 必读
          [ -f output/run_health.jsonl ] && \
            cp output/run_health.jsonl "$STATE_DIR/ai-morning-news/output/" || true
          cd "$STATE_DIR"
          ls -la ai-morning-news/
          git add ai-morning-news/
          git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ) shift=${{ steps.shift.outputs.shift }}"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # 1. force-push 主 briefing-state 分支（永远 1 commit, 给下次跑用）
          git push --force "$REMOTE" briefing-state:briefing-state
          echo "✓ state 已推回 briefing-state 分支"

          # 2. 时间戳快照: 同时打一个 tag (snapshot/YYYYMMDD-HHMM-shift),
          # 留 7 天滚动窗口可回滚. force-push 主分支时若推坏数据,
          # 找最近的 tag git checkout 出来恢复即可.
          SNAP_TAG="snapshot/$(date -u +%Y%m%d-%H%M)-${{ steps.shift.outputs.shift }}"
          git tag "$SNAP_TAG"
          git push "$REMOTE" "$SNAP_TAG" 2>&1 | tail -3 || echo "tag push failed (non-fatal)"
          echo "✓ snapshot tag: $SNAP_TAG"

          # 3. 清理 7 天前的快照 tag (远端 + 本地)
          # 列出所有 snapshot tag, 按时间排序, 删超过 14 个的 (7 天 × 2 班次)
          OLD_TAGS=$(git ls-remote --tags "$REMOTE" 'refs/tags/snapshot/*' 2>/dev/null \
            | awk '{print $2}' | sed 's|refs/tags/||' | sort | head -n -14)
          if [ -n "$OLD_TAGS" ]; then
            echo "清理过期快照: $OLD_TAGS"
            for t in $OLD_TAGS; do
              git push "$REMOTE" ":refs/tags/$t" 2>&1 | tail -1 || true
            done
          fi

      - name: Upload artifacts (logs + output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ steps.shift.outputs.shift }}-${{ github.run_number }}
          path: |
            ai-morning-news/output/
            ai-morning-news/daily_run.log
            ai-morning-news/collect.log
          if-no-files-found: warn
          retention-days: 7
