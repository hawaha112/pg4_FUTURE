name: AI Morning Briefing
# 云端运行版本：行为与 Mac launchd 完全一致。
# 状态(events.db / dedup.db / llm_cache.db) 通过独立分支 briefing-state 同步：
#   · 启动时 checkout briefing-state → 覆盖 ai-morning-news/ 下的 db 文件
#   · 跑完后 force-push 更新后的 db 回 briefing-state（孤立分支，永远只 1 个 commit）
#
# 触发方式：
#   - workflow_dispatch（手动）：可强制 shift（am/pm/auto）
#   - schedule cron：北京 06:00 早班 + 18:00 晚班（与本地 launchd plist 一致）
#     · PoC 期注释，等正式切到云端时取消注释 + 关本地 launchd

on:
  workflow_dispatch:
    inputs:
      shift:
        description: 'Force shift (auto = follow current UTC time)'
        type: choice
        options: [auto, am, pm]
        default: auto
  # schedule:
  #   - cron: '0 22 * * *'   # UTC 22:00 = 北京 06:00 早班
  #   - cron: '0 10 * * *'   # UTC 10:00 = 北京 18:00 晚班

concurrency:
  group: ai-morning-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # 需要 push briefing-state 分支
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BRIEFING_URL: ${{ secrets.BRIEFING_URL }}

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout briefing-state (db snapshot)
        uses: actions/checkout@v4
        with:
          ref: briefing-state
          path: state
        continue-on-error: true   # 第一次没这个分支也允许冷启动

      - name: Restore db files from state branch
        shell: bash
        run: |
          mkdir -p code/ai-morning-news
          if [ -d state/ai-morning-news ]; then
            cp -f state/ai-morning-news/*.db code/ai-morning-news/ 2>/dev/null || true
            cp -f state/ai-morning-news/*.json code/ai-morning-news/ 2>/dev/null || true
            echo "✓ 从 briefing-state 分支接续状态"
            ls -la code/ai-morning-news/*.db 2>/dev/null | awk '{print "  · " $9 ": " $5 " bytes"}'
          else
            echo "⚠️ 没有 briefing-state 分支，从 0 冷启动"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install certifi

      - name: Install Claude Code CLI
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code
          which claude && claude --version
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret 未设置"
            exit 1
          fi
          echo "✓ token 已注入环境"

      - name: Determine shift
        id: shift
        shell: bash
        run: |
          INPUT_SHIFT="${{ github.event.inputs.shift }}"
          if [ -n "$INPUT_SHIFT" ] && [ "$INPUT_SHIFT" != "auto" ]; then
            FINAL=$INPUT_SHIFT
          else
            UTC_HOUR=$(date -u +%-H)
            CN_HOUR=$(( (UTC_HOUR + 8) % 24 ))
            if [ "$CN_HOUR" -ge 6 ] && [ "$CN_HOUR" -lt 18 ]; then
              FINAL=pm
            else
              FINAL=am
            fi
          fi
          echo "shift=$FINAL" >> $GITHUB_OUTPUT
          echo "→ shift = $FINAL (UTC=$(date -u +%H:%M), CN=$(TZ='Asia/Shanghai' date +%H:%M))"

      - name: Start claude_proxy + LLM smoke test
        working-directory: code/ai-morning-news
        shell: bash
        run: |
          nohup python3 -u claude_proxy.py > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid
          for i in $(seq 1 30); do
            if curl -s http://localhost:3456/health > /dev/null 2>&1; then
              echo "✓ proxy ready ($i sec)"
              break
            fi
            sleep 1
          done
          resp=$(curl -s -m 90 http://localhost:3456/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"reply OK"}],"model":"claude-sonnet-4","max_tokens":20}')
          if echo "$resp" | grep -q '"content"'; then
            echo "✓ LLM 可调通"
          else
            echo "::error::LLM smoke test 失败"
            cat /tmp/proxy.log
            exit 1
          fi

      - name: Run collector
        working-directory: code/ai-morning-news
        env:
          BRIEFING_SHIFT: ${{ steps.shift.outputs.shift }}
        run: python3 collector.py 2>&1 | tee collect.log

      - name: Run briefing renderer
        working-directory: code/ai-morning-news
        env:
          BRIEFING_SHIFT: ${{ steps.shift.outputs.shift }}
        run: |
          python3 briefing_renderer.py 2>&1 | tee daily_run.log
          if [ -f output/stats.json ]; then
            echo "=== stats.json ==="
            cat output/stats.json | python3 -m json.tool
          fi

      - name: Stop claude_proxy
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/proxy.pid ]; then
            kill $(cat /tmp/proxy.pid) 2>/dev/null || true
          fi

      - name: Push updated state back to briefing-state branch
        if: success()
        shell: bash
        run: |
          # 用 orphan branch 模式：每次只保留最新 1 个 commit，避免 git 历史爆炸
          STATE_DIR=$(mktemp -d)
          git clone --depth 1 --branch briefing-state \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$STATE_DIR" 2>/dev/null || \
            (mkdir -p "$STATE_DIR" && cd "$STATE_DIR" && git init -q -b briefing-state && \
             git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git")

          cd "$STATE_DIR"
          rm -rf ai-morning-news
          mkdir -p ai-morning-news
          cd "$GITHUB_WORKSPACE/code/ai-morning-news"
          for f in events.db dedup.db llm_cache.db source_health.json history.json; do
            [ -f "$f" ] && cp "$f" "$STATE_DIR/ai-morning-news/" || true
          done

          cd "$STATE_DIR"
          ls -la ai-morning-news/

          # orphan 提交：丢弃历史，只保留最新 snapshot
          git checkout --orphan briefing-state-tmp
          git rm -rf --cached . 2>/dev/null || true
          git add ai-morning-news/
          git -c user.email="action@github.com" -c user.name="GitHub Action" \
            commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ) shift=${{ steps.shift.outputs.shift }}" \
            -m "auto-pushed by morning-briefing workflow"
          git branch -D briefing-state 2>/dev/null || true
          git branch -m briefing-state
          git push --force origin briefing-state
          echo "✓ 状态已推回 briefing-state 分支"

      - name: Upload PoC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ steps.shift.outputs.shift }}-${{ github.run_number }}
          path: |
            code/ai-morning-news/output/
            code/ai-morning-news/daily_run.log
            code/ai-morning-news/collect.log
            /tmp/proxy.log
          if-no-files-found: warn
          retention-days: 7
