name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check (v4 核心模块)
        run: |
          python -m py_compile collector.py
          python -m py_compile briefing_renderer.py
          python -m py_compile html_generator.py
          python -m py_compile llm_analyzer.py
          python -m py_compile event_store.py
          python -m py_compile dedup_engine.py

      - name: Shell lint
        run: |
          sudo apt-get install -y shellcheck
          shellcheck run_daily.sh run_collect.sh install_launchd.sh || true

      - name: Import chain smoke
        run: |
          python -c "from briefing_renderer import _has_substance; print('import ok')"
          python -c "from html_generator import generate_html, SOURCE_TIER_BADGES, AUDIENCE_LABELS; print('import ok')"
          python -c "from llm_analyzer import _smart_truncate; print(_smart_truncate('a'*100, 30, note='…'))"

      - name: Unit tests
        run: |
          [ -d tests ] && python -m unittest discover tests -v || echo "(no tests dir)"
