name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile fetch_news.py && python -m py_compile llm_analyzer.py

      - name: Shell lint
        run: |
          sudo apt-get install -y shellcheck
          shellcheck run_daily.sh deploy.sh install_launchd.sh

      - name: Dry run (--no-llm, verify import chain)
        run: python -c "from fetch_news import parse_rss; print('import ok')"
